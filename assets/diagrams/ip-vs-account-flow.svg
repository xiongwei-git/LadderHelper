<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="title desc">
  <title id="title">IP 问题 vs 账号问题判断流程图</title>
  <desc id="desc">帮助新手判断访问失败是代理 IP 问题、账号停用问题，还是平台综合风控问题。</desc>
  <style>
    text {
      font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      fill: #111827;
    }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #6b7280; }
    .node-title { font-size: 18px; font-weight: 700; }
    .node-body { font-size: 14px; fill: #4b5563; }
    .small { font-size: 13px; fill: #6b7280; }
    .label { font-size: 14px; font-weight: 700; }
    .card { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; }
    .start { fill: #eff6ff; stroke: #bfdbfe; }
    .ip { fill: #f0fdf4; stroke: #bbf7d0; }
    .account { fill: #fef2f2; stroke: #fecaca; }
    .risk { fill: #fff7ed; stroke: #fed7aa; }
    .action { fill: #f9fafb; stroke: #d1d5db; }
    .blue { stroke: #2563eb; }
    .green { stroke: #16a34a; }
    .red { stroke: #dc2626; }
    .orange { stroke: #ea580c; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#dc2626"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#ea580c"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#111827" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="820" fill="#ffffff"/>

  <text x="600" y="60" text-anchor="middle" class="title">IP 问题 vs 账号问题：先这样判断</text>
  <text x="600" y="90" text-anchor="middle" class="subtitle">遇到服务不可用时，不要立刻以为账号被封。先按现象分流，再决定处理方式。</text>

  <g filter="url(#soft-shadow)">
    <rect x="430" y="125" width="340" height="92" rx="14" class="card start"/>
    <text x="600" y="160" text-anchor="middle" class="node-title">访问服务失败</text>
    <text x="600" y="187" text-anchor="middle" class="node-body">打不开、无法登录，或提示当前区域不可用</text>
  </g>

  <path d="M600 217 L600 260" class="blue" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>

  <g filter="url(#soft-shadow)">
    <path d="M600 255 L820 335 L600 415 L380 335 Z" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="600" y="323" text-anchor="middle" class="node-title">页面是否提示</text>
    <text x="600" y="350" text-anchor="middle" class="node-title">“当前地区不可用”？</text>
  </g>

  <path d="M380 335 C260 335, 220 390, 220 455" class="green" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)"/>
  <text x="306" y="322" text-anchor="middle" class="label" fill="#16a34a">是</text>

  <g filter="url(#soft-shadow)">
    <rect x="70" y="455" width="300" height="150" rx="14" class="card ip"/>
    <text x="220" y="490" text-anchor="middle" class="node-title">大概率是 IP / 代理规则问题</text>
    <text x="100" y="525" class="node-body">1. 代理可能没有生效</text>
    <text x="100" y="550" class="node-body">2. 出口 IP 在不支持地区</text>
    <text x="100" y="575" class="node-body">3. 目标服务没有走固定节点</text>
  </g>

  <path d="M370 530 L455 530" class="green" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)"/>

  <g filter="url(#soft-shadow)">
    <rect x="455" y="455" width="300" height="150" rx="14" class="card action"/>
    <text x="605" y="490" text-anchor="middle" class="node-title">优先处理</text>
    <text x="485" y="525" class="node-body">检查客户端是否连接</text>
    <text x="485" y="550" class="node-body">查询当前出口 IP 地区</text>
    <text x="485" y="575" class="node-body">把目标服务固定走稳定节点</text>
  </g>

  <path d="M820 335 C940 335, 980 390, 980 455" class="red" stroke-width="2.5" fill="none" marker-end="url(#arrow-red)"/>
  <text x="894" y="322" text-anchor="middle" class="label" fill="#dc2626">否</text>

  <g filter="url(#soft-shadow)">
    <path d="M980 455 L1140 530 L980 605 L820 530 Z" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="980" y="518" text-anchor="middle" class="node-title">是否提示账号</text>
    <text x="980" y="545" text-anchor="middle" class="node-title">停用 / Deactivated？</text>
  </g>

  <path d="M980 605 L980 655" class="red" stroke-width="2.5" fill="none" marker-end="url(#arrow-red)"/>
  <text x="1006" y="632" class="label" fill="#dc2626">是</text>

  <g filter="url(#soft-shadow)">
    <rect x="825" y="655" width="310" height="125" rx="14" class="card account"/>
    <text x="980" y="690" text-anchor="middle" class="node-title">更可能是账号问题</text>
    <text x="855" y="725" class="node-body">按平台邮件和申诉流程处理</text>
    <text x="855" y="750" class="node-body">换代理通常不能直接恢复账号</text>
  </g>

  <path d="M820 530 C720 530, 710 650, 600 650" class="orange" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/>
  <text x="750" y="572" class="label" fill="#ea580c">否</text>

  <g filter="url(#soft-shadow)">
    <rect x="260" y="630" width="340" height="150" rx="14" class="card risk"/>
    <text x="430" y="665" text-anchor="middle" class="node-title">可能是综合风控</text>
    <text x="290" y="700" class="node-body">浏览器指纹、系统时区</text>
    <text x="290" y="725" class="node-body">支付信息、邮箱访问环境</text>
    <text x="290" y="750" class="node-body">账号行为等都可能影响判断</text>
  </g>

  <g transform="translate(70 700)">
    <rect x="0" y="0" width="150" height="58" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
    <line x1="18" y1="18" x2="48" y2="18" class="green" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    <text x="58" y="22" class="small">IP / 规则</text>
    <line x1="18" y1="40" x2="48" y2="40" class="red" stroke-width="2.5" marker-end="url(#arrow-red)"/>
    <text x="58" y="44" class="small">账号问题</text>
  </g>
</svg>
