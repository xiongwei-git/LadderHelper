<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="title desc">
  <title id="title">个人代理服务器访问链路简图</title>
  <desc id="desc">手机或电脑先连接个人域名，再到 VPS 服务器，最后由 VPS 访问目标网站。</desc>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #6b7280; }
    .node-title { font-size: 18px; font-weight: 700; }
    .node-body { font-size: 13px; fill: #6b7280; }
    .arrow-label { font-size: 13px; fill: #2563eb; font-weight: 600; }
    .note-title { font-size: 15px; font-weight: 700; }
    .note { font-size: 13px; fill: #4b5563; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#2563eb"/>
    </marker>
    <filter id="soft-shadow" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#111827" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="600" y="58" text-anchor="middle" class="title">个人代理服务器是怎么转发访问的</text>
  <text x="600" y="88" text-anchor="middle" class="subtitle">你的设备先连到自己的服务器，再由服务器替你访问目标网站</text>

  <g transform="translate(55 160)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="210" height="150" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
    <rect x="52" y="35" width="48" height="76" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="76" cy="101" r="3" fill="#2563eb"/>
    <rect x="111" y="49" width="58" height="42" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect x="127" y="94" width="26" height="6" rx="3" fill="#2563eb" opacity="0.7"/>
    <text x="105" y="128" text-anchor="middle" class="node-title">手机 / 电脑</text>
  </g>

  <g transform="translate(355 160)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="210" height="150" rx="16" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.6"/>
    <circle cx="105" cy="62" r="34" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <path d="M75 62 H135 M105 28 C91 44 91 80 105 96 M105 28 C119 44 119 80 105 96 M82 43 C96 49 114 49 128 43 M82 81 C96 75 114 75 128 81" stroke="#0f766e" stroke-width="2" fill="none"/>
    <text x="105" y="128" text-anchor="middle" class="node-title">个人域名</text>
    <text x="105" y="146" text-anchor="middle" class="node-body">如 node1.example.com</text>
  </g>

  <g transform="translate(655 160)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="210" height="150" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.6"/>
    <rect x="67" y="35" width="76" height="20" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect x="67" y="61" width="76" height="20" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect x="67" y="87" width="76" height="20" rx="4" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <circle cx="82" cy="45" r="3" fill="#16a34a"/><circle cx="82" cy="71" r="3" fill="#16a34a"/><circle cx="82" cy="97" r="3" fill="#16a34a"/>
    <text x="105" y="128" text-anchor="middle" class="node-title">VPS 服务器</text>
    <text x="105" y="146" text-anchor="middle" class="node-body">安装 3x-ui / 代理服务</text>
  </g>

  <g transform="translate(955 160)" filter="url(#soft-shadow)">
    <rect x="0" y="0" width="210" height="150" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
    <path d="M60 80 C42 79 37 58 55 51 C60 31 88 28 99 44 C112 34 135 41 139 59 C157 60 166 80 151 93 H62 C49 93 48 82 60 80 Z" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="105" y="128" text-anchor="middle" class="node-title">目标网站</text>
    <text x="105" y="146" text-anchor="middle" class="node-body">如 AI 服务 / 流媒体</text>
  </g>

  <path d="M265 235 H345" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/>
  <rect x="283" y="205" width="46" height="22" rx="5" fill="#ffffff" opacity="0.95"/>
  <text x="306" y="221" text-anchor="middle" class="arrow-label">连接</text>
  <path d="M565 235 H645" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/>
  <rect x="578" y="205" width="56" height="22" rx="5" fill="#ffffff" opacity="0.95"/>
  <text x="606" y="221" text-anchor="middle" class="arrow-label">解析到</text>
  <path d="M865 235 H945" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/>
  <rect x="878" y="205" width="56" height="22" rx="5" fill="#ffffff" opacity="0.95"/>
  <text x="906" y="221" text-anchor="middle" class="arrow-label">代访问</text>

  <g transform="translate(125 380)">
    <rect x="0" y="0" width="950" height="78" rx="14" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="28" y="32" class="note-title">读图方式</text>
    <text x="28" y="57" class="note">设备看到的是你配置的节点；目标网站看到的主要是 VPS 的出口 IP，而不是你本地网络的 IP。域名负责把好记的名字指向 VPS。</text>
  </g>
</svg>