<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="title desc">
<title id="title">服务器端口访问两层检查图</title>
<desc id="desc">外部访问需要通过服务商安全组和服务器系统防火墙，才能到达 3x-ui 或代理节点服务。</desc>
<style>text{font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#111827}.title{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#6b7280}.node-title{font-size:18px;font-weight:700}.body{font-size:13px;fill:#4b5563}.small{font-size:12px;fill:#6b7280}.arrow{stroke:#2563eb;stroke-width:3;fill:none}</style>
<defs><marker id="arrow" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0,12 4,0 8" fill="#2563eb"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#111827" flood-opacity="0.08"/></filter></defs>
<rect width="1200" height="640" fill="#ffffff"/>
<text x="600" y="58" text-anchor="middle" class="title">端口访问要过两道门</text>
<text x="600" y="88" text-anchor="middle" class="sub">服务已安装不等于外部能访问。安全组和系统防火墙都可能拦截端口。</text>
<g filter="url(#shadow)"><rect x="60" y="205" width="210" height="145" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.6"/>
<text x="165.0" y="260" text-anchor="middle" class="node-title">你的设备</text><text x="165.0" y="293" text-anchor="middle" class="body">浏览器 / 客户端</text></g>
<g filter="url(#shadow)"><rect x="330" y="185" width="230" height="185" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.6"/>
<text x="445.0" y="240" text-anchor="middle" class="node-title">服务商控制台</text><text x="445.0" y="273" text-anchor="middle" class="body">安全组 / 防火墙 / 入站规则</text></g>
<g filter="url(#shadow)"><rect x="635" y="185" width="230" height="185" rx="16" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.6"/>
<text x="750.0" y="240" text-anchor="middle" class="node-title">服务器系统</text><text x="750.0" y="273" text-anchor="middle" class="body">ufw / firewalld / 系统防火墙</text></g>
<g filter="url(#shadow)"><rect x="940" y="205" width="210" height="145" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.6"/>
<text x="1045.0" y="260" text-anchor="middle" class="node-title">服务进程</text><text x="1045.0" y="293" text-anchor="middle" class="body">3x-ui 面板 / 代理节点</text></g>
<path d="M270 278 H330" class="arrow" marker-end="url(#arrow)"/>
<path d="M560 278 H635" class="arrow" marker-end="url(#arrow)"/>
<path d="M865 278 H940" class="arrow" marker-end="url(#arrow)"/>
<rect x="300" y="245" width="84" height="24" rx="5" fill="#ffffff" opacity="0.95"/><text x="342" y="262" text-anchor="middle" class="small">访问端口</text>
<rect x="590" y="245" width="84" height="24" rx="5" fill="#ffffff" opacity="0.95"/><text x="632" y="262" text-anchor="middle" class="small">放行后继续</text>
<rect x="895" y="245" width="84" height="24" rx="5" fill="#ffffff" opacity="0.95"/><text x="937" y="262" text-anchor="middle" class="small">到达服务</text>
<g transform="translate(140 430)"><rect x="0" y="0" width="920" height="118" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="28" y="36" class="node-title">排查顺序</text>
<text x="28" y="68" class="body">1. 服务是否启动  2. 服务商安全组是否放行  3. 系统防火墙是否放行  4. 域名是否解析正确  5. 端口号是否填错</text>
<text x="28" y="96" class="small">正式使用时只开放必要端口；调试阶段临时放宽后，记得收紧规则。</text></g>
</svg>